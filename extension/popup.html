<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #17181c;
        color: #f0f1f4;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
        color: #2dd4bf;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
      }
      .dot.ok {
        background: #2dd4bf;
      }
      .hint {
        color: #9a9ea7;
        font-size: 12px;
        margin-top: 8px;
      }
      code {
        background: #101114;
        padding: 1px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>job-agent companion</h1>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status-text">Checking…</span>
    </div>
    <div id="personal"></div>
    <p class="hint">
      Visit a LinkedIn or Indeed job page to save it and check H-1B sponsor history. Keep
      <code>npm run serve</code> running in job-agent for this to work.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
